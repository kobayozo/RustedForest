<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustedForest</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: sans-serif;
        color: #eee;
      }
      #stamina-bar {
        position: absolute;
        left: 20px;
        bottom: 20px;
        width: 200px;
        height: 14px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 4px;
        overflow: hidden;
      }
      #stamina-bar-fill {
        width: 100%;
        height: 100%;
        background: #e8d44d;
        transition: width 0.08s linear;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
